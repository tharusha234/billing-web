<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Generator | Shop Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:#eef2f7;color:#0f172a;-webkit-font-smoothing:antialiased;
  }

  /* ================= APP LAYOUT ================= */
  .app{display:grid;grid-template-columns:390px minmax(0,1fr);min-height:100vh;}

  .panel{
    background:#fff;border-right:1px solid #e2e8f0;
    padding:26px 22px 40px;height:100vh;overflow-y:auto;
    position:sticky;top:0;align-self:start;
  }
  .panel h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em;}
  .panel .sub{font-size:12.5px;color:#64748b;margin:0 0 22px;}

  .group{padding-bottom:18px;margin-bottom:18px;border-bottom:1px dashed #e2e8f0;}
  .group:last-of-type{border-bottom:none;}
  .group h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:#0284c7;margin:0 0 12px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;
  }
  .saved-count{color:#94a3b8;font-weight:600;font-size:10.5px;letter-spacing:.06em;}

  label{display:block;font-size:11.5px;font-weight:600;color:#475569;margin-bottom:12px;}
  label:last-child{margin-bottom:0;}
  input{
    width:100%;margin-top:5px;padding:9px 11px;border:1px solid #dbe3ec;border-radius:9px;
    font:inherit;font-size:13.5px;color:#0f172a;background:#f8fafc;transition:.15s;
  }
  input:focus{outline:none;border-color:#0ea5e9;background:#fff;box-shadow:0 0 0 3px rgba(14,165,233,.12);}
  input::placeholder{color:#94a3b8;}
  input[type=file]{padding:7px 9px;font-size:12px;background:#fff;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ================= ITEM ROWS ================= */
  .itemRow{
    background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;
    padding:8px;margin-bottom:8px;
  }
  .itemTop{
    display:grid;grid-template-columns:66px 1fr 26px 26px;gap:6px;margin-bottom:6px;
  }
  .itemBottom{
    display:grid;grid-template-columns:60px 1fr auto;gap:6px;align-items:end;
  }
  .itemRow input{
    margin:0;padding:7px 8px;font-size:12.5px;border-radius:7px;background:#fff;
  }
  .itemRow label{
    margin:0;font-size:9.5px;font-weight:700;color:#64748b;
    text-transform:uppercase;letter-spacing:.06em;
  }
  .itemRow label input{margin-top:3px;}
  .itemRow .amt{
    font-size:13px;font-weight:700;color:#0284c7;text-align:right;
    padding-bottom:8px;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .itemRow .save,.itemRow .del{
    height:30px;border-radius:7px;border:1px solid;cursor:pointer;
    padding:0;font-size:14px;line-height:1;transition:.15s;
  }
  .itemRow .save{background:#f0f9ff;border-color:#bae6fd;color:#0284c7;}
  .itemRow .save:hover{background:#e0f2fe;}
  .itemRow .del{background:#fef2f2;border-color:#fecaca;color:#dc2626;font-size:17px;}
  .itemRow .del:hover{background:#fee2e2;}

  /* ================= SAVED ITEMS ================= */
  .savedList{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
  .savedList .empty{
    font-size:12px;color:#94a3b8;text-align:center;padding:14px;
    background:#f8fafc;border:1px dashed #e2e8f0;border-radius:8px;margin:0;line-height:1.5;
  }
  .savedItem{
    display:grid;grid-template-columns:1fr auto 26px 26px;gap:6px;align-items:center;
    padding:7px 9px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;
  }
  .savedInfo{min-width:0;display:flex;flex-direction:column;gap:1px;}
  .savedCode{font-size:9.5px;font-weight:700;color:#0284c7;letter-spacing:.05em;}
  .savedName{font-weight:600;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .savedPrice{font-weight:700;color:#475569;font-size:11.5px;font-variant-numeric:tabular-nums;}
  .savedItem .addSaved,.savedItem .delSaved{
    width:26px;height:26px;border-radius:6px;border:1px solid;cursor:pointer;
    padding:0;font-size:14px;line-height:1;transition:.15s;
  }
  .addSaved{background:#f0f9ff;border-color:#bae6fd;color:#0284c7;font-weight:700;}
  .addSaved:hover{background:#e0f2fe;}
  .delSaved{background:#fef2f2;border-color:#fecaca;color:#dc2626;font-size:16px;}
  .delSaved:hover{background:#fee2e2;}

  button{font:inherit;}
  .ghost{
    width:100%;padding:9px;border:1px dashed #0ea5e9;color:#0284c7;background:#f0f9ff;
    border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;
  }
  .ghost:hover{background:#e0f2fe;}

  .primary{
    width:100%;padding:13px;border:none;border-radius:11px;cursor:pointer;
    background:#0ea5e9;color:#fff;font-weight:700;font-size:14.5px;
    box-shadow:0 6px 16px rgba(14,165,233,.28);transition:.15s;
  }
  .primary:hover{background:#0284c7;}
  .primary:disabled{opacity:.7;cursor:wait;}

  /* ================= PREVIEW ================= */
  .previewWrap{padding:32px;display:flex;justify-content:center;align-items:flex-start;overflow-x:auto;}

  .paper{
    width:794px;
    background:#fff;
    padding:38px;
    box-shadow:0 12px 44px rgba(15,23,42,.12);
    flex:0 0 auto;
  }

  .invoice{
    display:flex;
    flex-direction:column;
    min-height:1035px;   /* buffer so PDF doesn't spill to a blank 2nd page */
    font-size:14px;
    color:#0f172a;
    background:#fff;
  }

  /* ---- HEADER ---- */
  .inv-head{
    display:flex;justify-content:space-between;gap:26px;
    padding-bottom:22px;border-bottom:2px solid #0ea5e9;
  }
  .brand{display:flex;gap:14px;align-items:flex-start;min-width:0;}
  .logo{
    width:56px;height:56px;border-radius:14px;flex:0 0 auto;
    background:#0ea5e9;color:#fff;display:grid;place-items:center;
    font-weight:800;font-size:24px;letter-spacing:-.02em;
  }
  .logo.has-img{background:#fff;border:1px solid #e2e8f0;}
  .shopName{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.2;word-break:break-word;}
  .shopMeta{font-size:12.5px;color:#64748b;margin-top:5px;line-height:1.55;white-space:pre-line;}

  .inv-meta{text-align:right;flex:0 0 auto;}
  .inv-title{font-size:24px;font-weight:800;letter-spacing:.16em;color:#0ea5e9;line-height:1;}
  .meta-line{display:flex;justify-content:flex-end;gap:10px;font-size:12.5px;color:#64748b;margin-top:7px;}
  .meta-line b{color:#0f172a;font-weight:600;}

  .billto{margin-top:22px;}
  .billto .label{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:#94a3b8;}
  .cust{font-size:16px;font-weight:700;margin-top:6px;}
  .custMeta{font-size:12.5px;color:#64748b;margin-top:2px;}

  /* ---- TABLE ---- */
  .inv-table{width:100%;border-collapse:collapse;margin-top:22px;}
  .inv-table thead{display:table-header-group;}
  .inv-table th{
    background:#0284c7;color:#fff;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:12px 14px;text-align:left;font-weight:700;
  }
  .inv-table th:first-child{border-radius:9px 0 0 9px;}
  .inv-table th:last-child{border-radius:0 9px 9px 0;}
  .inv-table td{padding:11px 14px;border-bottom:1px solid #eef2f7;font-size:13.5px;vertical-align:top;}
  .inv-table tbody tr:nth-child(even) td{background:#f8fafc;}
  .inv-table .c{text-align:center;width:40px;}
  .inv-table .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .inv-table .code{font-size:12px;color:#64748b;white-space:nowrap;width:78px;}
  .inv-table .name{font-weight:600;}
  .inv-table .b{font-weight:700;}
  .inv-table .muted{color:#94a3b8;}
  .inv-table .empty{text-align:center;color:#94a3b8;font-style:italic;padding:30px;}

  /* ---- TOTALS ---- */
  .totals{margin-top:18px;margin-left:auto;width:330px;}
  .trow{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;
        font-size:13.5px;color:#475569;border-bottom:1px dashed #e8edf3;}
  .trow b{color:#0f172a;font-weight:600;font-variant-numeric:tabular-nums;}
  .trow.grand{
    margin-top:10px;border:none;background:#0ea5e9;color:#fff;
    padding:14px 18px;border-radius:12px;font-size:14px;font-weight:700;
  }
  .trow.grand b{color:#fff;font-size:18px;font-weight:800;}

  /* ---- FOOTER ---- */
  .inv-foot{margin-top:auto;padding-top:22px;border-top:1px solid #eef2f7;text-align:center;}
  .inv-foot p{margin:0;font-size:13px;font-weight:600;color:#0284c7;}
  .inv-foot .small{font-size:11px;color:#94a3b8;font-weight:400;margin-top:4px;}

  /* ---- PDF page-break rules ---- */
  .inv-head,.billto,.totals,.trow,.inv-foot,.inv-table thead,.brand,.inv-meta{
    break-inside:avoid;page-break-inside:avoid;
  }
  .inv-table tr{break-inside:avoid;page-break-inside:avoid;}

  /* ================= MOBILE ================= */
  @media (max-width:1080px){
    .app{grid-template-columns:1fr;}
    .panel{position:static;height:auto;border-right:none;border-bottom:1px solid #e2e8f0;}
    .previewWrap{justify-content:flex-start;padding:18px;}
  }
</style>
</head>
<body>

<div class="app">

  <!-- ================= FORM ================= -->
  <aside class="panel">
    <h1>Invoice Builder</h1>
    <p class="sub">Shop details → Items → PDF</p>

    <section class="group">
      <h2>Shop Details</h2>
      <label>Shop Name
        <input id="shopName" value="My Shop" placeholder="ඔබේ කඩේ නම" />
      </label>
      <label>Address
        <input id="shopAddress" placeholder="123, Main Street, Colombo" />
      </label>
      <label>Phone
        <input id="shopPhone" placeholder="07X XXX XXXX" />
      </label>
      <label>Logo (optional)
        <input type="file" id="logoFile" accept="image/*" />
      </label>
    </section>

    <section class="group">
      <h2>Invoice Info</h2>
      <div class="row2">
        <label>Invoice No
          <input id="invoiceNo" value="INV-0001" />
        </label>
        <label>Date
          <input type="date" id="invoiceDate" />
        </label>
      </div>
      <label>Customer Name
        <input id="customerName" placeholder="Customer name" />
      </label>
      <label>Customer Phone
        <input id="customerPhone" placeholder="optional" />
      </label>
    </section>

    <section class="group">
      <h2>Items</h2>
      <div id="formItems"></div>
      <button type="button" id="addItemBtn" class="ghost">+ Add Item</button>
    </section>

    <section class="group">
      <h2>Saved Items <span class="saved-count" id="savedCount"></span></h2>
      <div id="savedList" class="savedList"></div>
    </section>

    <section class="group">
      <h2>Payment</h2>
      <div class="row2">
        <label>Currency
          <input id="currency" value="Rs." />
        </label>
        <label>Discount
          <input type="number" id="discount" value="0" min="0" step="0.01" />
        </label>
      </div>
    </section>

    <button id="pdfBtn" class="primary">⬇ Download PDF</button>
  </aside>

  <!-- ================= PREVIEW ================= -->
  <main class="previewWrap">
    <div class="paper">
      <div class="invoice" id="invoice">

        <div class="inv-head">
          <div class="brand">
            <div class="logo" id="invLogo">S</div>
            <div>
              <div class="shopName" id="invShopName">My Shop</div>
              <div class="shopMeta" id="invShopMeta"></div>
            </div>
          </div>
          <div class="inv-meta">
            <div class="inv-title">INVOICE</div>
            <div class="meta-line"><span>Invoice No</span><b id="invNo">—</b></div>
            <div class="meta-line"><span>Date</span><b id="invDate">—</b></div>
          </div>
        </div>

        <div class="billto">
          <div class="label">BILLED TO</div>
          <div class="cust" id="invCustomer">Walk-in Customer</div>
          <div class="custMeta" id="invCustomerPhone"></div>
        </div>

        <table class="inv-table" id="invTable">
          <thead>
            <tr>
              <th class="c">#</th>
              <th class="code">Code</th>
              <th>Item</th>
              <th class="r">Qty</th>
              <th class="r">Price</th>
              <th class="r">Amount</th>
            </tr>
          </thead>
          <tbody id="invItems"></tbody>
        </table>

        <div class="totals">
          <div class="trow"><span>Subtotal</span><b id="invSubtotal">0.00</b></div>
          <div class="trow"><span>Discount</span><b id="invDiscount">0.00</b></div>
          <div class="trow grand"><span>Total</span><b id="invTotal">0.00</b></div>
        </div>

        <div class="inv-foot">
          <p>Thank you for your business!</p>
          <p class="small">This is a computer generated invoice.</p>
        </div>

      </div>
    </div>
  </main>
</div>

<datalist id="catalogNames"></datalist>

<script>
/* ============================================================
   0. UTILITIES
   ============================================================ */
const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ============================================================
   1. STATE + CATALOG (localStorage)
   ============================================================ */
const panel = document.querySelector('.panel');
const formItems = $('#formItems');
let logoData = null;

const CATALOG_KEY = 'invoice_catalog_v1';

function loadCatalog(){
  try { return JSON.parse(localStorage.getItem(CATALOG_KEY)) || []; }
  catch { return []; }
}
function saveCatalog(list){
  try { localStorage.setItem(CATALOG_KEY, JSON.stringify(list)); }
  catch(e){ console.warn('localStorage save failed', e); }
}
function addToCatalog(item){
  const list = loadCatalog();
  const idx = list.findIndex(x => x.name === item.name && (x.code || '') === (item.code || ''));
  if(idx >= 0){
    list[idx].price = item.price;
    list[idx].code = item.code;
  } else {
    list.push({ code: item.code || '', name: item.name, price: item.price || 0 });
  }
  saveCatalog(list);
  renderCatalog();
}

function renderCatalog(){
  const list = loadCatalog();
  const el = $('#savedList');
  const cnt = $('#savedCount');
  if(cnt) cnt.textContent = list.length ? '(' + list.length + ')' : '';

  if(!list.length){
    el.innerHTML = '<p class="empty">No saved items yet.<br>Click 💾 on an item to save it.</p>';
  } else {
    el.innerHTML = list.map((it, i) => `
      <div class="savedItem">
        <div class="savedInfo">
          ${it.code ? `<span class="savedCode">${esc(it.code)}</span>` : ''}
          <span class="savedName">${esc(it.name || 'Unnamed')}</span>
        </div>
        <span class="savedPrice">${fmt(it.price)}</span>
        <button type="button" class="addSaved" data-i="${i}" title="Add to invoice">+</button>
        <button type="button" class="delSaved" data-i="${i}" title="Delete">×</button>
      </div>
    `).join('');

    el.querySelectorAll('.addSaved').forEach(b => {
      b.onclick = () => {
        const it = list[+b.dataset.i];
        if(!it) return;
        addItemRow(it.code, it.name, 1, it.price);
        render();
      };
    });
    el.querySelectorAll('.delSaved').forEach(b => {
      b.onclick = () => {
        const it = list[+b.dataset.i];
        if(!it) return;
        if(!confirm('Delete saved item "' + it.name + '"?')) return;
        const newList = list.slice();
        newList.splice(+b.dataset.i, 1);
        saveCatalog(newList);
        renderCatalog();
      };
    });
  }
  updateDatalist();
}

function updateDatalist(){
  const list = loadCatalog();
  $('#catalogNames').innerHTML = list.map(x => `<option value="${esc(x.name)}">`).join('');
}

/* ============================================================
   2. INVOICE LOGIC
   ============================================================ */

/* default date = today */
(function(){
  const t = new Date();
  $('#invoiceDate').value =
    t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
})();

function addItemRow(code = '', name = '', qty = 1, price = ''){
  const row = document.createElement('div');
  row.className = 'itemRow';
  row.innerHTML =
    '<div class="itemTop">' +
      '<input class="i-code" placeholder="Code" value="' + esc(code) + '" autocomplete="off">' +
      '<input class="i-name" placeholder="Item name" value="' + esc(name) + '" list="catalogNames" autocomplete="off">' +
      '<button type="button" class="save" title="Save to catalog">💾</button>' +
      '<button type="button" class="del" title="Remove">×</button>' +
    '</div>' +
    '<div class="itemBottom">' +
      '<label>Qty<input class="i-qty" type="number" min="0" step="1" value="' + qty + '"></label>' +
      '<label>Price<input class="i-price" type="number" min="0" step="0.01" value="' + price + '" placeholder="0.00"></label>' +
      '<div class="amt">0.00</div>' +
    '</div>';

  row.querySelector('.del').addEventListener('click', () => {
    row.remove();
    render();
  });

  row.querySelector('.save').addEventListener('click', () => {
    const code = row.querySelector('.i-code').value.trim();
    const name = row.querySelector('.i-name').value.trim();
    const price = parseFloat(row.querySelector('.i-price').value) || 0;
    if(!name && !code){ alert('Enter item name or code first.'); return; }
    addToCatalog({ code, name: name || code, price });
    const btn = row.querySelector('.save');
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = '💾', 900);
  });

  /* Auto-fill from catalog when name exactly matches a saved item */
  const nameInput = row.querySelector('.i-name');
  nameInput.addEventListener('input', () => {
    const v = nameInput.value.trim();
    if(!v) return;
    const found = loadCatalog().find(x => x.name === v);
    if(found){
      const codeEl = row.querySelector('.i-code');
      const priceEl = row.querySelector('.i-price');
      if(!codeEl.value) codeEl.value = found.code || '';
      if(!priceEl.value) priceEl.value = (found.price ?? '');
      render();
    }
  });

  formItems.appendChild(row);
  return row;
}

function getRows(){
  return [...formItems.querySelectorAll('.itemRow')].map(r => ({
    code:  r.querySelector('.i-code').value.trim(),
    name:  r.querySelector('.i-name').value.trim(),
    qty:   parseFloat(r.querySelector('.i-qty').value) || 0,
    price: parseFloat(r.querySelector('.i-price').value) || 0
  })).filter(it => it.name !== '' || it.code !== '' || it.price > 0);
}

function prettyDate(v){
  if(!v) return '—';
  const d = new Date(v + 'T00:00:00');
  if(isNaN(d.getTime())) return v;
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

function render(){
  const shopName = $('#shopName').value.trim() || 'My Shop';
  const cur = $('#currency').value.trim();
  const curPre = cur ? cur + ' ' : '';

  $('#invShopName').textContent = shopName;

  const logo = $('#invLogo');
  if(logoData){
    logo.classList.add('has-img');
    logo.style.backgroundImage = 'url("' + logoData + '")';
    logo.style.backgroundSize = 'cover';
    logo.style.backgroundPosition = 'center';
    logo.textContent = '';
  } else {
    logo.classList.remove('has-img');
    logo.style.backgroundImage = '';
    logo.textContent = shopName.charAt(0).toUpperCase();
  }

  const meta = [$('#shopAddress').value.trim(), $('#shopPhone').value.trim()].filter(Boolean);
  $('#invShopMeta').textContent = meta.join('\n');

  $('#invNo').textContent = $('#invoiceNo').value.trim() || '—';
  $('#invDate').textContent = prettyDate($('#invoiceDate').value);

  const cust = $('#customerName').value.trim();
  $('#invCustomer').textContent = cust || 'Walk-in Customer';
  const cphone = $('#customerPhone').value.trim();
  $('#invCustomerPhone').textContent = cphone ? 'Phone: ' + cphone : '';

  /* live line totals in the form */
  formItems.querySelectorAll('.itemRow').forEach(r => {
    const qty = parseFloat(r.querySelector('.i-qty').value) || 0;
    const price = parseFloat(r.querySelector('.i-price').value) || 0;
    r.querySelector('.amt').textContent = curPre + fmt(qty * price);
  });

  /* invoice items */
  const rows = getRows();
  const tbody = $('#invItems');

  if(rows.length){
    tbody.innerHTML = rows.map((it, i) => {
      const amt = it.qty * it.price;
      const qtyStr = Number.isInteger(it.qty) ? it.qty : it.qty.toFixed(2);
      const codeCell = it.code ? esc(it.code) : '<span class="muted">—</span>';
      return '<tr>' +
        '<td class="c muted">' + (i+1) + '</td>' +
        '<td class="code">' + codeCell + '</td>' +
        '<td class="name">' + esc(it.name || 'Item') + '</td>' +
        '<td class="r">' + qtyStr + '</td>' +
        '<td class="r">' + curPre + fmt(it.price) + '</td>' +
        '<td class="r b">' + curPre + fmt(amt) + '</td>' +
      '</tr>';
    }).join('');
  } else {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No items added yet</td></tr>';
  }

  const subtotal = rows.reduce((s, it) => s + it.qty * it.price, 0);
  const discount = Math.max(0, parseFloat($('#discount').value) || 0);
  const total = Math.max(0, subtotal - discount);

  $('#invSubtotal').textContent = curPre + fmt(subtotal);
  $('#invDiscount').textContent = curPre + fmt(discount);
  $('#invTotal').textContent = curPre + fmt(total);
}

panel.addEventListener('input', render);
$('#addItemBtn').addEventListener('click', () => { addItemRow(); render(); });

$('#logoFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { logoData = r.result; render(); };
  r.readAsDataURL(f);
});

/* ============================================================
   3. MULTI-PAGE PDF DOWNLOAD (fixed)
   ============================================================ */
$('#pdfBtn').addEventListener('click', async () => {
  const btn = $('#pdfBtn');
  const label = btn.textContent;
  const el = $('#invoice');

  btn.disabled = true;
  btn.textContent = 'Generating PDF...';

  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 60)); /* let layout settle */

    const shop = ($('#shopName').value.trim() || 'Invoice').replace(/[^\w\u0D80-\u0DFF-]+/g, '_');
    const no   = ($('#invoiceNo').value.trim() || 'bill').replace(/[^\w-]+/g, '_');

    await html2pdf().set({
      margin: [10, 10, 10, 10],
      filename: shop + '_' + no + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: {
        mode: ['css', 'legacy'],
        avoid: ['tr', '.inv-head', '.billto', '.totals', '.trow', '.inv-foot', 'thead']
      }
    }).from(el).save();

  }catch(err){
    console.error(err);
    alert('PDF generate කරන්න බැරි වුණා. නැවත try කරන්න.');
  }finally{
    btn.disabled = false;
    btn.textContent = label;
  }
});

/* ============================================================
   4. INIT
   ============================================================ */
addItemRow();
renderCatalog();
render();
</script>
</body>
</html>
